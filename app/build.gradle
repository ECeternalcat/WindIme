plugins {
    id 'com.android.application'
}

android {
    namespace 'com.garaho.ime'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.garaho.ime"
        minSdk 21
        targetSdk 28
        versionCode 20
        versionName "0.5.3"

        // Direct boot aware for FDE/FBE devices (doc 5.1)
        // Declared in manifest via android:directBootAware="true"

        // Prebuilt librime_jni.so ships only for armeabi-v7a (doc target
        // hardware: flip-phones). On other ABIs System.loadLibrary fails and
        // GarahoImeService falls back to the pure-Java T9PinyinEngine.
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }

    packagingOptions {
        // Single librime_jni.so per ABI; no STL shared lib needed (statically linked).
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure native View / Focus system per design doc - no Compose / Material3.
    // AndroidX core only, kept slim for API 21+ compatibility.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
