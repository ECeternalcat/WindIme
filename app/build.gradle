plugins {
    id 'com.android.application'
}

android {
    namespace 'com.garaho.ime'
    compileSdk 34

    defaultConfig {
        applicationId "com.garaho.ime"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "0.1.0"

        // Direct boot aware for FDE/FBE devices (doc 5.1)
        // Declared in manifest via android:directBootAware="true"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // librime.so JNI integration (doc 3.3)
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Target common flip-phone ABIs (arm翻盖机 dominant)
    defaultConfig {
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Skeleton only at Phase 1; full librime integration at later phase.
                cppFlags '-std=c++11 -fexceptions -frtti'
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }

    packagingOptions {
        // Avoid duplicate c++_shared.so from librime prebuilt
        pickFirst 'lib/**/libc++_shared.so'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure native View / Focus system per design doc - no Compose / Material3.
    // AndroidX core only, kept slim for API 21+ compatibility.
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
