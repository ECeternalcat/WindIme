plugins {
    id 'com.android.application'
}

def easterEggAssetsDir = layout.buildDirectory.dir('generated/easterEggAssets')

tasks.register('copyEasterEggAsset', Copy) {
    from rootProject.file('Document/Easter egg.JPG')
    into easterEggAssetsDir
}

android {
    namespace 'com.garaho.ime'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.garaho.ime"
        minSdk 19
        targetSdk 28
        versionCode 25
        versionName "0.5.8"

        // Prebuilt librime_jni.so ships only for armeabi-v7a (doc target
        // hardware: flip-phones). On other ABIs System.loadLibrary fails and
        // GarahoImeService falls back to the pure-Java T9PinyinEngine.
        ndk {
            abiFilters 'armeabi-v7a'
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
            assets.srcDir(easterEggAssetsDir)
        }
    }

    packagingOptions {
        // Single librime_jni.so per ABI; no STL shared lib needed (statically linked).
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // targetSdk migration needs vendor-device regression testing and is
        // tracked as A-13 in the current audit. Keep all other lint errors fatal.
        disable 'ExpiredTargetSdkVersion'
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyEasterEggAsset')
}

dependencies {
    // Pure native View / Focus system per design doc - no Compose / Material3.
    // AndroidX core only, kept slim for API 21+ compatibility.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
