# Rime schema: luna_pinyin (WindIme minimal preset)
# A small, dependency-free pinyin schema that compiles the bundled
# luna_pinyin.dict.yaml into a prism + table on first launch.
schema:
  schema_id: luna_pinyin
  name: 简拼
  version: "0.1"
  author:
    - WindIme
  description: |
    Minimal Mandarin pinyin schema bundled with WindIme.
    Replace with rime-ice-t9 for full T9 + vocabulary.

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs])h/$1/

translator:
  dictionary: luna_pinyin
  prism: luna_pinyin
  preedit_format:
    - "xform/([nl])v/$1ü/"

punctuator:
  half_shape:
    "," : ，
    "." : 。
    "<" : 《
    ">" : 》
    "/" : ／
    "?" : ？
    ";" : ；
    ":" : ：
    "''" : { pair: [ "“", "”" ] }
    "[" : 【
    "]" : 】
    "{" : ｛
    "}" : ｝
    "|" : ｜
    "\\" : 、
    "~" : ～
    "!" : ！
    "@" : ＠
    "#" : ＃
    "%" : ％
    "$" : ￥
    "^" : ……
    "&" : ＆
    "*" : ×
    "(" : （
    ")" : ）
    "-" : "-"
    "_" : ——
    "=" : ＝
    "+" : ＋

simplifier:
  option_name: simplification
