# Rime schema: luna_pinyin (WindIme minimal preset)
# Bare-minimum pinyin: speller + abc_segmentor + script_translator.
# No ascii_composer / punctuator / recognizer on purpose - WindIme handles
# 中/英/数字/符号 modes itself, and stripping them removes the
# "Missing ascii bindings" error and keeps the prism tiny.
schema:
  schema_id: luna_pinyin
  name: 简拼
  version: "0.2"
  author:
    - WindIme
  description: |
    Minimal Mandarin pinyin schema bundled with WindIme.
    Replace with rime-ice-t9 for full T9 + vocabulary.

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs])h/$1/

translator:
  dictionary: luna_pinyin
  prism: luna_pinyin
  preedit_format:
    - "xform/([nl])v/$1ü/"
