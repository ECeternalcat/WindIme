# Rime default settings (WindIme minimal preset)
# config_version bumps whenever the bundled data layout changes.
config_version: "0.1"

schema_list:
  - schema: luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

menu:
  page_size: 10
