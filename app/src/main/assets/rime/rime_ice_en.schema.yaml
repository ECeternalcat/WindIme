# Optional Rime English schema. WindIme's normal English T9 mode remains the
# lightweight Java engine; this schema is available for future letter input.
schema:
  schema_id: rime_ice_en
  name: 雾凇英文·WindIme
  version: "1.0"
  author:
    - iDvel/rime-ice contributors (dictionary data)
    - WindIme contributors (Android schema)

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: rime_ice_en
  prism: rime_ice_en_windime
  enable_user_dict: true
  enable_sentence: false
