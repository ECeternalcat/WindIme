# WindIme's low-overhead schema over the official rime-ice Chinese dictionaries.
# This intentionally omits Lua, OpenCC, Emoji, English and grammar-model
# components that are not needed by WindIme's physical-key input pipeline.
schema:
  schema_id: rime_ice
  name: 雾凇拼音·WindIme
  version: "1.0"
  author:
    - iDvel/rime-ice contributors (dictionary data)
    - WindIme contributors (minimal Android schema)
  description: |
    Full rime-ice common Chinese vocabulary with a minimal schema for
    low-memory physical-key Android devices.

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: rime_ice
  prism: rime_ice_windime
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  preedit_format:
    - "xform/([nl])v/$1ü/"
